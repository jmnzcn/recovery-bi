[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recovery-bi"
version = "0.1.0"
description = "A Power BI report generated as code (TMDL + PBIR) from vendor-recovery-engine findings, with DAX checked to the cent against an independent reference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.23", "referencing>=0.35"]

[project.scripts]
recovery-bi = "recovery_bi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_bi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
